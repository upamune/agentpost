[tools]
bun = "1.4.4"
node = "24.22.1"
pinact = "5.0.1"
actionlint = "1.7.12"
jq = "1.8.2"
gitleaks = "8.30.1"
java = "temurin-21.0.11+10.0.LTS"
"github:tlaplus/tlaplus" = { version = "1.7.4", asset_pattern = "tla2tools.jar", checksum = "sha256:936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" }
# init-projectで指定されたosmove/backlog。npmの公開元を確認した上で、このパッケージのみ許可する。
"npm:backlog" = { version = "1.4.56", allow_low_downloads = true }
"github:zizmorcore/zizmor" = "1.31.1"
"github:google/osv-scanner" = "2.7.0"

[tools."github:moznion/cccc"]
version = "1.8.4"

[tools."github:moznion/cccc".platforms]
macos-arm64 = { asset_pattern = "cccc-v1.8.4-aarch64-apple-darwin.tar.gz", checksum = "sha256:f8f015ce3ec60db09bb6823aae9dc9e6bfdb13d79ae50a1bcfd3518357deeda9" }
macos-x64 = { asset_pattern = "cccc-v1.8.4-x86_64-apple-darwin.tar.gz", checksum = "sha256:4fde0cf0eec82dc78a0587f1bfae5ecf154bfb2f3959cff9deba2b35d430c662" }
linux-arm64 = { asset_pattern = "cccc-v1.8.4-aarch64-unknown-linux-musl.tar.gz", checksum = "sha256:caad978e8595db0ba07585aad6b63affdee0d28f191b620d1cfd02e51e31186b" }
linux-x64 = { asset_pattern = "cccc-v1.8.4-x86_64-unknown-linux-musl.tar.gz", checksum = "sha256:64b3084e05cf2f75d4af57268a2b898526c04be7bc31d0a36708081b13a64f97" }
windows-x64 = { asset_pattern = "cccc-v1.8.4-x86_64-pc-windows-msvc.zip", checksum = "sha256:37dd68e0446ef578c06ab56ed5ffbc8cf7f219a09676b91e1f8f2b43b68c96f8" }

[tasks.dev]
run = "bun run dev"

[tasks.format]
run = "bun run format"

[tasks."format:check"]
run = "bun run format:check"

[tasks.lint]
run = ["bun run lint", "bun run knip", "pinact run --check", "actionlint"]

[tasks.typecheck]
run = "bun run typecheck"

[tasks.test]
depends = ["test:worker", "test:bun"]

[tasks."test:worker"]
run = "bun run test:worker"

[tasks."test:bun"]
run = "bun run test:bun"

[tasks.build]
run = "bun run build"

[tasks.fuzz]
run = "bun run fuzz"

[tasks.complexity]
run = "bun run scripts/check-complexity.ts"

[tasks."complexity:report"]
run = "cccc --config cccc.toml --no-cache --pretty src scripts verification"

[tasks."release:build"]
run = "bun run scripts/build-release.ts"

[tasks."cli:build"]
run = "bun run scripts/build-executable.ts"

[tasks."cli:smoke"]
run = "bun run scripts/smoke-executable.ts"

[tasks."release:finalize"]
run = "bun run scripts/finalize-release.ts"

[tasks."npm:build"]
run = "bun run scripts/build-npm.ts"

[tasks."npm:smoke"]
run = "bun run scripts/smoke-npm.ts"

[tasks.secrets]
run = "gitleaks git --redact --no-banner --log-opts=--all"

[tasks.audit]
run = "bun audit"

[tasks."security:workflows"]
run = "zizmor --offline --no-progress --persona auditor --min-severity low .github"

[tasks."security:dependencies"]
run = "osv-scanner scan source --lockfile=bun.lock"

[tasks."verify:outbound"]
run = "bun run verification/check.ts outbound"

[tasks."verify:outbound:selftest"]
run = "bun run verification/check.ts outbound --selftest"

[tasks."verify:inbound"]
run = "bun run verification/check.ts inbound"

[tasks."verify:inbound:selftest"]
run = "bun run verification/check.ts inbound --selftest"

[tasks."verify:attachments"]
run = "bun run verification/attachments/check.ts"

[tasks."verify:attachments:selftest"]
run = "bun run verification/attachments/check.ts --selftest"

[tasks."verify:webhooks"]
run = "bun run verification/webhooks/check.ts"

[tasks."verify:webhooks:selftest"]
run = "bun run verification/webhooks/check.ts --selftest"

[tasks.verify]
depends = [
  "verify:outbound:selftest",
  "verify:inbound:selftest",
  "verify:attachments:selftest",
  "verify:webhooks:selftest",
]

[tasks.ci]
depends = [
  "format:check",
  "lint",
  "typecheck",
  "test",
  "build",
  "secrets",
  "audit",
  "security:workflows",
  "fuzz",
  "complexity",
  "verify",
]
