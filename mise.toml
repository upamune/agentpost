[tools]
bun = "1.4.4"
node = "24.22.1"
pinact = "5.0.1"
actionlint = "1.7.12"
gitleaks = "8.30.1"
# init-projectで指定されたosmove/backlog。npmの公開元を確認した上で、このパッケージのみ許可する。
"npm:backlog" = { version = "1.4.56", allow_low_downloads = true }

[tasks.dev]
run = "bun run dev"

[tasks.format]
run = "bun run format"

[tasks."format:check"]
run = "bun run format:check"

[tasks.lint]
run = ["bun run lint", "bun run knip", "pinact run --check", "actionlint"]

[tasks.typecheck]
run = "bun run typecheck"

[tasks.test]
run = "bun run test"

[tasks.build]
run = "bun run build"

[tasks.secrets]
run = "gitleaks git --redact --no-banner --log-opts=--all"

[tasks.audit]
run = "bun audit"

[tasks.ci]
depends = ["format:check", "lint", "typecheck", "test", "build", "secrets", "audit"]
