[tools]
bun = "1.4.4"
node = "24.22.1"
pinact = "5.0.1"
actionlint = "1.7.12"
gitleaks = "8.30.1"
java = "temurin-21.0.11+10.0.LTS"
"github:tlaplus/tlaplus" = { version = "1.7.4", asset_pattern = "tla2tools.jar", checksum = "sha256:936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" }
# init-projectで指定されたosmove/backlog。npmの公開元を確認した上で、このパッケージのみ許可する。
"npm:backlog" = { version = "1.4.56", allow_low_downloads = true }

[tasks.dev]
run = "bun run dev"

[tasks.format]
run = "bun run format"

[tasks."format:check"]
run = "bun run format:check"

[tasks.lint]
run = ["bun run lint", "bun run knip", "pinact run --check", "actionlint"]

[tasks.typecheck]
run = "bun run typecheck"

[tasks.test]
run = "bun run test"

[tasks.build]
run = "bun run build"

[tasks.secrets]
run = "gitleaks git --redact --no-banner --log-opts=--all"

[tasks.audit]
run = "bun audit"

[tasks."verify:outbound"]
run = "bun run verification/check.ts outbound"

[tasks."verify:outbound:selftest"]
run = "bun run verification/check.ts outbound --selftest"

[tasks."verify:inbound"]
run = "bun run verification/check.ts inbound"

[tasks."verify:inbound:selftest"]
run = "bun run verification/check.ts inbound --selftest"

[tasks.verify]
depends = [
  "verify:outbound",
  "verify:inbound",
  "verify:outbound:selftest",
  "verify:inbound:selftest",
]

[tasks.ci]
depends = ["format:check", "lint", "typecheck", "test", "build", "secrets", "audit", "verify"]
