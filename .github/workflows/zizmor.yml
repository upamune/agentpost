name: Workflow security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor analysis
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # Publish SARIF findings to this repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        id: analysis
        with:
          version: 1.31.1
          persona: auditor
          min-severity: low
      - name: Fail on workflow security findings
        env:
          RESULTS: ${{ steps.analysis.outputs.output-file }}
        run: jq -e '(.runs | length > 0) and ([.runs[].results[]?] | length == 0)' "$RESULTS"
