name: Verified release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
          - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-npm
          path: |
            release/upamune-agentpost-*.tgz
            release/SHA256SUMS
            release/release-manifest.json
            release/provenance.sigstore.json
          if-no-files-found: error
          retention-days: 14

  publish:
        description: Publish the existing version tag after verifying all assets
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          cache: false
      - run: bun install --frozen-lockfile
      - name: Validate release source
        id: source
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          version=$(bun -e 'process.stdout.write(require("./package.json").version)')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          tag="v$version"
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || exit 1
          fi
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF_TYPE" == tag ]] || exit 1
            [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$commit" ]] || exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - run: mise run ci
      - run: mise run security:dependencies
      - run: mise run npm:build --verify-reproducible
        env:
          AGENTPOST_RELEASE_TAG: ${{ steps.source.outputs.tag }}
      - run: mise run release:build
        env:
          AGENTPOST_RELEASE_TAG: ${{ steps.source.outputs.tag }}
      - run: cp dist/npm/*.tgz dist/release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  executables:
    needs: build
    uses: $/.github/workflows/executables.yml
    with:
      source_commit: ${{ needs.build.outputs.commit }}

  assemble:
    needs: [build, executables]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: dist/release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: executable-*
          merge-multiple: true
          path: dist/release/
      - run: mise run release:finalize
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          AGENTPOST_RELEASE_TAG: ${{ needs.build.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: [build, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sign provenance using GitHub's short-lived OIDC identity.
      attestations: write # Register the signed build provenance with GitHub.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: release/*
      - name: Preserve the signed provenance and verify all assets
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" release/provenance.sigstore.json
          jq -ce '.dsseEnvelope | select(.payloadType == "application/vnd.in-toto+json")' "$BUNDLE" > release/provenance.intoto.jsonl
          for subject in release/agentpost-* release/upamune-agentpost-*.tgz release/SHA256SUMS release/release-manifest.json; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --bundle release/provenance.sigstore.json --source-digest "$SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --deny-self-hosted-runners
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, attest]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Attach verified assets and publish the draft release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: release/
      - name: Recheck integrity before publishing
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq .sha)" == "$SOURCE_COMMIT" ]] || exit 1
          cd release
          for subject in agentpost-* upamune-agentpost-*.tgz SHA256SUMS release-manifest.json; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --bundle provenance.sigstore.json --source-digest "$SOURCE_COMMIT" \
              --source-ref "refs/tags/$TAG" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --deny-self-hosted-runners
          done
          sha256sum --check SHA256SUMS
      - name: Inspect existing release
        id: existing
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${process.env.TAG}`, {
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'},
            signal: AbortSignal.timeout(30000), redirect: 'error',
          });
          let published = false;
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`Release lookup failed: HTTP ${response.status}`);
            const release = await response.json();
            published = release.draft === false;
            if (published && release.immutable !== true) throw new Error('Existing release is not immutable');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          NODE
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.existing.outputs.published != 'true'
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.commit }}
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
          append_body: true
          body: |
            Agentpost gives AI agents random or custom email addresses on an operator-owned domain,
            with send/receive/reply, a standalone CLI, MCP, and resumable mailbox events.
            Token and Cloudflare Access OAuth modes preserve per-inbox ownership. Raw-first storage,
            conditional send claims, adversarial tests, formal verification, and continuous security
            checks protect the documented boundaries.

            Source and standalone executables support self-hosted installations. Cloudflare Email Sending remains Beta.
            Verify each download's GitHub attestation and SHA256SUMS before installing.
            This release does not deploy a Worker or certify production readiness.
          files: release/*
      - name: Verify uploaded draft assets and publish an immutable release
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          ALREADY_PUBLISHED: ${{ steps.existing.outputs.published }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          expected=("agentpost-${TAG#v}.tar.gz" "upamune-agentpost-${TAG#v}.tgz" SHA256SUMS release-manifest.json provenance.sigstore.json provenance.intoto.jsonl)
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 linux-arm64-musl linux-x64-musl windows-x64.exe; do
            expected+=("agentpost-${TAG#v}-$platform")
          done
          [[ "$(find downloaded -mindepth 1 -maxdepth 1 | wc -l)" -eq "${#expected[@]}" ]] || exit 1
          for name in "${expected[@]}"; do
            [[ -f "downloaded/$name" && ! -L "downloaded/$name" ]] || exit 1
            # A previous valid draft run may have a different Sigstore signature.
            # Its payload files must match exactly; verify its original bundle below.
            if [[ "$name" != provenance.* ]]; then
              cmp "release/$name" "downloaded/$name"
            fi
          done
          cd downloaded
          for subject in agentpost-* upamune-agentpost-*.tgz SHA256SUMS release-manifest.json; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --bundle provenance.sigstore.json --source-digest "$SOURCE_COMMIT" \
              --source-ref "refs/tags/$TAG" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --deny-self-hosted-runners
          done
          jq -ce '.dsseEnvelope' provenance.sigstore.json > envelope.jsonl
          cmp envelope.jsonl provenance.intoto.jsonl
          sha256sum --check SHA256SUMS
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq .sha)" == "$SOURCE_COMMIT" ]] || exit 1
          if [[ "$ALREADY_PUBLISHED" != true ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '{tag_name,draft,immutable}' > state.json
          jq -e --arg tag "$TAG" '.draft == false and .immutable == true and .tag_name == $tag' state.json
