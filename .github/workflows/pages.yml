name: Project website

on:
  push:
    branches: [main]
    paths:
      [
        "website/**",
        "assets/brand/**",
        "scripts/build-site.ts",
        "mise.toml",
        ".github/workflows/pages.yml",
      ]
  pull_request:
    paths:
      [
        "website/**",
        "assets/brand/**",
        "scripts/build-site.ts",
        "mise.toml",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  build:
    name: site build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.17
          install_args: bun
      - run: mise run site:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/site
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Deployment uses Pages/OIDC only. No repository write token or mail credentials.
    permissions:
      pages: write # Publish the reviewed static artifact to this repository's Pages site.
      id-token: write # Attest the main-branch deployment identity to GitHub Pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
