name: npm package compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-node22:
    name: npm (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.17
          install_args: bun node@22.23.4
          cache: true
      - run: mise exec node@22.23.4 -- bun install --frozen-lockfile --ignore-scripts
      - run: mise exec node@22.23.4 -- bun run scripts/build-npm.ts --verify-reproducible
      - run: mise exec node@22.23.4 -- bun run scripts/smoke-npm.ts
